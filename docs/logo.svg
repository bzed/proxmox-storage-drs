<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="pve-storage-drs logo">
  <!--
    Project logo for proxmox-storage-drs: two storage pools with a disk
    moving between them, balanced by a return flow. Original artwork; it
    deliberately shares no geometry or colour with Proxmox's own marks,
    and carries no trademarked word inside the mark itself.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2433"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- return flow: dotted arc from the right-hand pool back to the left -->
  <path d="M 196 70 Q 128 14 60 70" fill="none" stroke="#64748b"
        stroke-width="4" stroke-linecap="round" stroke-dasharray="0.5 13"/>
  <polygon points="49.9,78.2 55.6,64.6 64.4,75.4" fill="#64748b"/>

  <!-- left storage pool -->
  <g>
    <path d="M 26 92 V 150 A 34 12 0 0 0 94 150 V 92 Z" fill="#7c8ba0"/>
    <path d="M 26 122 A 34 12 0 0 0 94 122" fill="none" stroke="#5c6b80" stroke-width="3"/>
    <ellipse cx="60" cy="92" rx="34" ry="12" fill="#a3b2c5"/>
  </g>

  <!-- right storage pool -->
  <g>
    <path d="M 162 92 V 150 A 34 12 0 0 0 228 150 V 92 Z" fill="#7c8ba0"/>
    <path d="M 162 122 A 34 12 0 0 0 228 122" fill="none" stroke="#5c6b80" stroke-width="3"/>
    <ellipse cx="196" cy="92" rx="34" ry="12" fill="#a3b2c5"/>
  </g>

  <!-- the disk being moved -->
  <circle cx="128" cy="156" r="28" fill="#dfe6ee"/>
  <circle cx="128" cy="156" r="17" fill="none" stroke="#aeb9c9" stroke-width="2.5"/>
  <circle cx="128" cy="156" r="7" fill="#1e293b"/>
  <circle cx="128" cy="156" r="2.5" fill="#a3b2c5"/>

  <!-- migration arrow: left pool to right pool, under the disk -->
  <path d="M 60 168 Q 128 226 188 172" fill="none" stroke="#2dd4bf"
        stroke-width="9" stroke-linecap="round"/>
  <polygon points="199.9,161.3 193.0,177.6 183.0,166.4" fill="#2dd4bf"/>
</svg>
