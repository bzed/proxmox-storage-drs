# Machine-readable form of IMPLEMENTATION_PLAN.md section 14.
#
# Fixture contract: a test harness reads this file, and for EACH value in
# objective.beta_values solves the group and asserts the matching entry in
# cases[] of fc-tier1.expected.json (same order). All other objective weights
# are held fixed across the sweep. Sizes and capacities are TiB; loads are in
# average-in-flight-I/O units (plan section 4), NOT normalised to sum to 1.
#
# Regenerate expectations with `python3 generate_expected.py`; do not hand-edit
# fc-tier1.expected.json. `generate_expected.py --check` asserts it is current.
#
# Field-naming convention: a knob that exists in config/drs.example.yaml uses
# THE SAME NAME here -- source_load_weight, target_load_weight,
# wipe_load_weight, gamma_move_bytes_per_tib, account_saferemove_wipe. Two
# deliberate exceptions, both because a fixture is machine-fed and the config
# is human-written: payback_horizon_seconds is an integer where the config
# accepts "7d", and beta_values is a list the harness sweeps where the config
# has a single beta_move_count.
schema_version: 1
description: Section 14 worked example. Numbers verified by exhaustive enumeration
  of all 3^6 assignments.
group:
  name: fc-tier1
  capacity_tib: 8.0
  reserve_factor: 2.0
  storages:
  - id: san-a
    capability_weight: 1.0
    capacity_tib: 8.0
    foreign_used_tib: 0.0
    saferemove: false
    saferemove_throughput_bytes_per_sec: 10485760
  - id: san-b
    capability_weight: 1.0
    capacity_tib: 8.0
    foreign_used_tib: 0.0
    saferemove: false
    saferemove_throughput_bytes_per_sec: 10485760
  - id: san-c
    capability_weight: 1.0
    capacity_tib: 8.0
    foreign_used_tib: 0.0
    saferemove: false
    saferemove_throughput_bytes_per_sec: 10485760
disks:
- key: 101:scsi0
  vmid: 101
  device: scsi0
  size_tib: 2.0
  load: 3.0
  current_storage: san-a
- key: 101:scsi1
  vmid: 101
  device: scsi1
  size_tib: 1.0
  load: 1.0
  current_storage: san-a
- key: 102:scsi0
  vmid: 102
  device: scsi0
  size_tib: 1.5
  load: 2.5
  current_storage: san-a
- key: 103:scsi0
  vmid: 103
  device: scsi0
  size_tib: 0.5
  load: 0.4
  current_storage: san-b
- key: 104:scsi0
  vmid: 104
  device: scsi0
  size_tib: 1.0
  load: 0.3
  current_storage: san-b
- key: 105:scsi0
  vmid: 105
  device: scsi0
  size_tib: 0.5
  load: 0.2
  current_storage: san-c
migration:
  bwlimit_bytes_per_sec: 209715200
  source_load_weight: 1.0
  target_load_weight: 1.0
  wipe_load_weight: 1.0
  # Plan section 7.1. saferemove is off on every storage above, so
  # duration_wipe_d = 0 and duration_d = duration_mirror_d, which is what the
  # section 14.5 payback arithmetic assumes. Stated here rather than only in the
  # prose so the fixture is self-contained -- note the CONFIG default is
  # account_saferemove_wipe: true, and with saferemove on, the 1.5 TiB move
  # costs ~44h of wipe on top of ~2.2h of mirror.
  account_saferemove_wipe: false
  payback_horizon_seconds: 604800
  payback_ratio: 10.0
objective:
  alpha_spread: 1.0
  # Swept by the harness; one cases[] entry in the expected file per value.
  beta_values: [0.25, 0.5]
  gamma_move_bytes_per_tib: 0.05   # penalty per TiB migrated
  kappa_vm_affinity: 0.5
  reserve_violation_penalty: 1000.0
