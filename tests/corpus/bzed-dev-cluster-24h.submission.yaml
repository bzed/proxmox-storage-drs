versions:
  pve: 9.2.11
  prometheus_backend: gigapipe
what_this_reproduces: >
  A real 3-node PVE cluster (bzed-shared group, two shared RBD storages, 15 VMs,
  39 disks), captured with `--range 24h` to stay under the 8 MiB ceiling. Exercises
  the full collect-testdata/--replay round trip against real cluster shapes rather
  than a synthetic fixture: pattern-expanded group storages, per-disk coverage from
  the real Telegraf/InfluxDB/gigapipe metrics pipeline, and the MILP-vs-heuristic
  comparison at a scale no fixture enumerates. Also the bundle that found and fixed
  seven real collector bugs during development (pattern-storage config loss,
  anonymized-vs-real selector confusion, query-text sort order, sample-timestamp
  rebasing, node-label handling, a device-label leak via the Prometheus `instance`
  label colliding with the scrape-target label, and metric names wrongly validated
  as device keys) -- see git history around 2026-09-11.
recaptures:
  - date: 2026-09-23
    why: >
      A production cluster with hundreds of VMs spread across many groups
      reported Prometheus queries timing out outright ("query timed out in
      expression evaluation") on `plan`. Root cause: every group's raw-quantity
      and coverage queries aggregated the *whole cluster*, unfiltered by the
      group's own vmids (REVIEW.md Q-02, previously accepted as "Low, wasteful
      but correct" for a 1-3 group deployment) -- at hundreds of VMs the
      unfiltered aggregation itself timed out, not just redundantly repeated
      per group. Fix: every such query is now additionally scoped to the
      calling group's own vmids (`metrics.group_query_selectors()`), batched
      to `metrics.VMID_QUERY_BATCH_SIZE` for groups larger than that. This
      changes the PromQL text every such query sends, which is this bundle's
      own file-lookup key (`hash_query_text()`) -- the old committed bytes no
      longer match what a live/replay run asks for, so the bundle was
      recaptured from the same real dev cluster with the exact same `--range
      24h` this submission always used, rather than patched.
    incidental_size_change: >
      Recapturing also picked up `metrics.safe_range_step_seconds()` (an
      unrelated, already-merged fix for a live-confirmed gigapipe bug, merged
      after 2026-09-11 -- see that function's own docstring) for the first
      time: this bundle's `metrics.step`/`metrics.rate_window` sit exactly on
      that function's failing boundary (both 300s, this project's own
      defaults), so every affected query is now captured at a finer,
      workaround-safe grid than the original 2026-09-11 capture predating the
      fix ever saw. Unpacked size grew from ~7.3 MiB to ~14 MiB, over the 8
      MiB documented ceiling (tests/corpus/README.md) as a result -- per
      Bernd's own explicit call (range/step parameters otherwise identical),
      accepted rather than reparametrized, since this bundle sitting exactly
      on the default step/rate_window boundary is itself representative: "a
      fresh install with untouched defaults can hit this on an affected
      backend with no misconfiguration at all" (safe_range_step_seconds()'s
      own docstring).
