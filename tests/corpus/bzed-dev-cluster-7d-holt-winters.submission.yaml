      (REVIEW.md Z-01). Superseded by the 2026-09-23 recapture above; kept
      here as historical record of what the pre-2026-09-23 bytes once
      contained.
    fixed_by: bb9417b (collector fix, prior commit)
    repaired_by: 2026-09-14 commit (rebuilt each message from the structured
      sample_series field beside it, per tests/corpus/README.md's repair
