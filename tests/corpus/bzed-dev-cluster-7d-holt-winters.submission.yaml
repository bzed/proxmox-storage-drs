submitted_by: Bernd Zeimetz <bernd@bzed.de>
submitted_on: 2026-09-23
consent:
  redistribute_under: AGPL-3.0-or-later
  # False on purpose -- see bzed-dev-cluster-24h.submission.yaml's identical
  # note; the same recapture session hand-reviewed this bundle the same way.
  reviewed_bundle_before_sending: false
collected_with: pve-storage-drs 0.1.7
versions:
  pve: 9.2.11
  prometheus_backend: gigapipe
what_this_reproduces: >
  The same real 3-node cluster as bzed-dev-cluster-24h, this time captured with
  window.lookback: 7d and forecast.model: holt_winters (metrics.step raised to
  1h, and holt_winters.seasonal_periods scaled from 288 to 24 to match, to keep
  the bundle under the 8 MiB ceiling at 7 days of history -- see config/drs.yaml
  and manifest.json's capture block). bzed-dev-cluster-24h's 24h lookback is too
  short for holt_winters (needs 48h) or seasonal_naive (needs 7d), so both
  gracefully skip in every variant sweep against it; this bundle actually
  exercises holt_winters end to end instead of skipping it.

  Also the bundle that found check_milp_vs_heuristic's move-count-as-proxy false
  positive in tests/corpus/validate_corpus.py (fixed in the preceding commit):
  cpsat legitimately used more moves than the heuristic to reach a far better
  spread at objective.beta_move_count=0.0, which the old check misread as "the
  MILP did worse".
recaptures:
  - date: 2026-09-23
    why: >
      Same root cause and fix as bzed-dev-cluster-24h.submission.yaml's own
      2026-09-23 recapture entry: every group-scoped Prometheus query now
      carries an additional vmid selector (REVIEW.md Q-02), which changes the
      PromQL text this bundle's files are looked up by. Recaptured from the
      same real dev cluster with the exact same `--range 7d --step 1h` this
      submission always used.
    incidental_size_change: >
      Same mechanism as bzed-dev-cluster-24h's own note: recapturing also
      picked up metrics.safe_range_step_seconds() for the first time (merged
      after this bundle's original 2026-09-11 capture) -- this bundle's
      metrics.step (1h) sits *far* above metrics.rate_window (300s), so the
      workaround's own step-narrowing (1h -> ~276s, a ~13x finer grid) is much
      more pronounced here than on bzed-dev-cluster-24h. Unpacked size grew
      from ~4.6 MiB to ~51 MiB, well past the 8 MiB documented ceiling
      (tests/corpus/README.md) -- per Bernd's own explicit call, accepted
      rather than reparametrized (range/step identical to the original
      capture).
