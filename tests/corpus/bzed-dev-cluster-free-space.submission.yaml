what_this_reproduces: >
  The first bundle captured *after* phase 13 (free-space requirements, plan section
  5.3.1), from the same real 3-node dev cluster as the two older bundles but with all
  three shared RBD storages in the group (the older bundles carry two, and were captured
  with the pre-phase-13 collector, so their config.yaml still holds the deprecated
  snapshot_reserve.min_free_bytes scalar and no free_space block -- they stay as the proof
  that such a bundle still replays).

  The live config that produced it: a /VM.*/ storage pattern, a global free_space of
  soft 70% / hard 10%, and literal per-storage overrides of soft 85% (the ~10 TiB
  storage) and 80% (the ~8.5 TiB one). Pattern, literal override, global inheritance and
  percent-to-bytes conversion therefore all fed one resolution, and config.yaml records
  the *resolved* per-storage soft/hard pair in bytes, all three different. Because the
  provisioned sizes of the disks count as used space (section 5.1.1) and the requirements
  are high, the big storage starts 1.86 TiB short: the plan is a repair, exempt from the
  payback test (section 7.3), and hard < soft lets the scheduler order it without the
  transient deadlock that hard = soft produces on the same data (verified against the
  live cluster on 2026-09-19: the solver's endpoint matched an independent CP-SAT model
  to the byte, 545 GiB total shortfall, and the executed plan reached it with hard 10%
  where hard = soft dropped moves as deadlocked).

  Captured with --range 24h --step 1h and window.lookback 24h under the default
  quantile forecaster: a 7-day capture of this cluster's metrics is now ~6x larger than
  the 4.4 MiB the older holt_winters bundle was, well over the 8 MiB ceiling.
