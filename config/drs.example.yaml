# proxmox-storage-drs — reference configuration
# Every value shown is the default unless marked REQUIRED.
#
# Install this to /etc/pve/drs.yaml. That path is on the cluster filesystem, so
# the file is replicated to every node and there is exactly one authoritative
# copy; a management host that is not a cluster member provides the same path
# locally. pve-storage-drs looks for its config in this order, first match wins:
#
#   1. --config PATH  (-c)      missing or invalid -> hard error, no fallback
#   2. $PVE_STORAGE_DRS_CONFIG          missing or invalid -> hard error, no fallback
#   3. /etc/pve/drs.yaml        the default
#
# Two warnings that follow from the location:
#   - An edit here is live on every node immediately. There is no staging.
#   - Files under /etc/pve are group-readable by www-data. Check `ls -l` before
#     putting a password in this file, and prefer an API token plus
#     PVE_TOKEN_SECRET from the environment.

# Config format version. config.py rejects an unknown MAJOR version rather than
# misinterpreting fields.
schema_version: 1

# ---------------------------------------------------------------- connections
proxmox:
  host: pve01.example.com          # REQUIRED. Any cluster member.
  port: 8006
  verify_ssl: true
  ca_file: null                    # optional path to a CA bundle
  auth:
    # Password auth (as requested). An API token is supported and preferred for
    # unattended operation: set token_id/token_secret instead of username/password.
    username: drs@pve              # REQUIRED
    # Leave the secret out of this file when the config lives in /etc/pve: both
    # of these read from the environment when left null.
    password: null                 # REQUIRED unless token_* is set; env: PVE_PASSWORD
    token_id: null                 # e.g. "drs@pve!balancer"
    token_secret: null             # env: PVE_TOKEN_SECRET
  ticket_refresh_seconds: 3000     # PVE tickets last 2h; refresh well before
  # PVE has no batch config endpoint, so topology is O(number of VMs) requests.
  # Bounded parallelism for the read phase.
  read_workers: 12

prometheus:
  url: http://prometheus.example.com:9090   # REQUIRED
  timeout_seconds: 30
  # Basic auth / bearer token if your Prometheus is protected
  username: null
  password: null
  bearer_token: null

# ------------------------------------------------------- metric name mapping
# Telegraf/InfluxDB naming varies by deployment. Run `pve-storage-drs verify-metrics` after
# editing this block; it validates every name against the live server and prints
# a sample series before you rely on it.
metrics:
  # Metric names. Default assumes Telegraf's influxdb_listener with the
  # measurement "blockstat" and fields joined by "_".
  read_ops:      blockstat_rd_operations
  write_ops:     blockstat_wr_operations
  read_bytes:    blockstat_rd_bytes
  write_bytes:   blockstat_wr_bytes
  read_time_ns:  blockstat_rd_total_time_ns
  write_time_ns: blockstat_wr_total_time_ns

  labels:
    vmid: vmid
    # PVE emits the drive id (scsi0, virtio0) in a tag named "instance", which
    # COLLIDES with Prometheus's own scrape "instance" label. Many Telegraf
    # setups rename it. Confirm with `pve-storage-drs verify-metrics` and set it here.
    device: instance
    node: nodename

  rate_window: 5m       # inner range for rate(); must be >= 4x pvestatd_push_interval
  step: 5m              # sampling step for range queries
  # PVE-side push cadence of pvestatd. The tool cannot read this from the API, so
  # declare it here; `pve-storage-drs verify-metrics` measures the real sample spacing of a
  # live series and errors if this value is wrong by more than 20%.
  pvestatd_push_interval: 60s

  # Every query is scoped automatically, so a Prometheus shared by more than
  # one PVE cluster cannot silently sum in a same-numbered vmid from
  # somewhere else: by default to labels.node =~ "<this cluster's own node
  # names>" (fetched from the PVE API). Set extra_selector to override that
  # with a raw PromQL label matcher of your own -- e.g. if your Telegraf
  # tagging doesn't use PVE's own node names, you want to scope by a
  # cluster-naming tag your deployment happens to carry, or you need to
  # restrict by something else entirely:
  # extra_selector: 'cluster="mycluster"'
  extra_selector: null

# ------------------------------------------------------------ decision window
window:
  # The DECISION window: the period whose load we balance. This is NOT the same
  # as the history a forecaster needs -- see the forecast: block below.
  lookback: 24h
  quantile: 0.95        # point estimate: the statistic every placement decision uses
  upper_quantile: 0.99  # Upper bound on the same load; must be >= quantile. Consumed
                        # ONLY by the saturation guard (migration.saturation_ceiling
                        # below), and only for a storage that sets saturation_load: the
                        # guard asks whether a move could push a storage past saturation
                        # at its busiest rather than at its typical. Placement itself is
                        # decided from the point estimate above, so raising this never
                        # moves a disk somewhere else -- it only makes the guard more
                        # cautious about starting a move now.
  min_coverage: 0.80    # reject a disk's data if fewer than this fraction of
                        # expected samples are present

# ------------------------------------------------------------------ load model
# Read and write series are fetched separately and combined ENGINE-SIDE:
#   raw_X(d) = read_factor*rd_X + write_factor*wr_X    for X in {time, ops, bytes}
# each term is normalized by its group total so the three are commensurable, the
# blend is weighted, and the result is RESCALED back onto the in-flight-I/O scale:
#   load = T_g * (w_iotime*iotime_hat + w_ops*ops_hat + w_bytes*bytes_hat)
#              / (w_iotime + w_ops + w_bytes)
# with T_g the group's total in-flight I/O. So `load` is in average in-flight I/O
# requests -- the same physical unit as migration.source/target_load_weight, which
# is what makes the payback comparison under `migration:` below a valid one. With
# the defaults below the whole expression collapses to
# load = rate(rd+wr_total_time_ns)/1e9 exactly.
load_weights:
  iotime: 1.0           # primary: rate(rd+wr_total_time_ns)/1e9, dimensionless
  ops:    0.0
  bytes:  0.0
  # Read/write asymmetry. Intended for the ops and bytes terms, where the real
  # cost difference between a read and a write is NOT otherwise represented
  # (a RAID-6 write costs far more than a read of the same size).
  # The iotime term already measures that cost directly, so applying these to it
  # double-counts -- do so only deliberately.
  read_factor:  1.0
  write_factor: 1.0

# --------------------------------------------------------------------- groups
# A disk may only ever move between storages listed in the SAME group.
#
# storages[].id may also be a `/regex/` pattern instead of a literal id --
# both delimiters required. Every storage in the cluster whose id
# `re.fullmatch`es it joins the group, present and future, with no config
# edit needed when a new one shows up, and that entry's own options apply
# to every storage it matches:
#
#   - id: /san-.*/            # every san-* LUN, present and future
#     capability_weight: 1.0
#
# A literal entry always overrides a pattern that also matches its storage,
# so one exception can still be pinned to different options within a
# pattern-matched family. Matching is case-sensitive and is redone against
# the live inventory on every run. Once the patterns are expanded a storage
# must belong to at most ONE group -- two groups claiming it would leave a
# disk's eligible destinations ambiguous -- so validation rejects that, and
# rejects a pattern that matches no storage at all, or two patterns in one
# group claiming the same storage. `pve-storage-drs verify-storages` prints
# what every pattern actually matched; run it after editing this block.
groups:
  # NOTE: this group intentionally mirrors tests/fixtures/fc-tier1.yaml -- same
  # storage names, same capability weights (all 1.0). Keep them in sync; the
  # differing-weight feature is illustrated on fc-tier2 below so the fixture stays
  # reproducible from this file.
  - name: fc-tier1
    storages:
      - id: san-a
        capability_weight: 1.0     # RELATIVE share of load this storage should carry.
                                   # Only ratios within a group matter; the absolute
                                   # value is meaningless. Not a capacity.
        reserve_factor: null       # null = inherit global snapshot_reserve.factor
        # Absolute number of concurrent I/O requests this array services before
        # queueing delay dominates -- roughly its effective queue depth, in the same
        # units as the load metric above. Used ONLY by the saturation guard
        # (migration.saturation_ceiling). There is no safe default: leave it null and
        # that advisory guard is skipped for this storage (the hard bounds --
        # max_single_move_duration and the transient reserve invariant -- always
        # apply). Do not guess it from
        # observed load; take it from the array's documented queue depth, or measure
        # the load at which latency starts climbing super-linearly.
        saturation_load: null
        # Per-storage/per-pattern free_space.soft/hard override -- same shape as
        # the top-level free_space: block below, most specific wins. See that
        # section for the full semantics; not set here, so this entry inherits
        # the global values.
        # free_space:
        #   soft: "15%"
        #   hard: null
      - id: san-b
        capability_weight: 1.0
      - id: san-c
        capability_weight: 1.0
  - name: fc-tier2
    storages:
      - id: san-d
        capability_weight: 1.0
        saturation_load: 64        # this array services ~64 concurrent I/Os
      - id: san-e
        capability_weight: 0.5     # half the spindles -> carries half the load

# --------------------------------------------------------- snapshot reserve
snapshot_reserve:
  # Keep factor * (largest disk on the storage) free at all times, including
  # transiently during a migration. PVE 9 volume-chain snapshots allocate a new
  # full-size LV per snapshot, which is what this protects.
  factor: 2.0
  # DEPRECATED: syntax for free_space.soft below. Still accepted -- folded in
  # as a per-storage lower bound on top of the resolved free_space.soft, never
  # as a substitute for it -- but new configs should set free_space.soft
  # instead, which has per-storage and percentage forms this scalar never had.
  min_free_bytes: 0
  # Count volumes not managed by DRS (templates, orphans, other clusters)
  # against capacity. Strongly recommended.
  count_foreign_volumes: true

# ---------------------------------------------------------------- free space
# Keep N bytes (or N% of capacity) free on top of the snapshot reserve above --
# the larger of the two wins, on every storage, always (section 5.3 (C5)/5.3.1).
# This is the Storage-DRS mandate: an admin's new VM lands on a storage that is
# now too full, and the engine migrates data off it until the requirement is
# met again -- bypassing the drift/imbalance gates and the payback economics,
# exactly like a snapshot-reserve violation does.
free_space:
  # The plan-ENDPOINT requirement: (C5) enforces it on the finished plan, and
  # a violation is repaired unconditionally. An integer byte count, a
  # byte-unit string ("500GiB"), or a percentage ("10%", resolved per storage
  # against that storage's own capacity). 0 = no requirement beyond the
  # snapshot reserve above -- this default changes nothing for a config that
  # sets nothing here.
  soft: 0
  # The TRANSIENT floor: how far a storage may dip below `soft` while a move
  # is in flight (section 8.1) -- a mirror target is fully allocated before
  # its source releases anything, so a plan that lands a disk on a storage
  # heading toward `soft` needs room to pass through it. null (the default)
  # means hard = soft: no dip at all, the same strength this invariant had
  # before free_space existed. Leave this null unless you have deliberately
  # decided to trade a bounded, planned dip for it -- never set it lower "to
  # make a plan fit"; that is what soft itself is for.
  hard: null
  # Per-storage or per-pattern override, most specific wins (same shape,
  # placed inside a groups[].storages[] entry):
  #
  #   - id: san-a
  #     free_space:
  #       soft: "15%"      # this LUN alone keeps 15% of its own capacity free
  #       hard: null        # null here means "inherit the global value above"

# ------------------------------------------------------------------- gating
gates:
  # Minimum relative change in the load vector since the last balance before we
  # even re-plan. Prevents thrashing on noise.
  drift_threshold: 0.10          # 10%
  # Minimum relative I/O spread across a group before we act at all.
  imbalance_threshold: 0.20      # 20%
  # Minimum relative spread in fill fraction (bytes/capacity) across a group before
  # we act at all, even when I/O is perfectly balanced -- the data-spread counterpart
  # of imbalance_threshold. null disables the gate entirely.
  capacity_spread_threshold: 0.25  # 25%
  cooldown_per_disk: 24h
  cooldown_per_storage: 1h

# --------------------------------------------------- migration cost / payback
migration:
  bwlimit_bytes_per_sec: 209715200     # 200 MiB/s; passed to move_disk
  source_load_weight: 1.0              # added in-flight I/O on the source
  target_load_weight: 1.0              # added in-flight I/O on the target
  payback_horizon: 365d                # H -- an explicit assumption about how long a
                                        # placement lasts, not operator patience (7.2)
  payback_ratio: 10.0                  # lambda; benefit must exceed lambda * cost
  max_single_move_duration: 6h         # reject any move slower than this (mirror + wipe)
  # Account for the post-move source wipe in duration and cost. PVE's LVM
  # "saferemove" zeroes the old volume at saferemove_throughput -- DEFAULT 10 MiB/s,
  # so a 1.5 TiB disk takes ~44h to clean up against ~2h to mirror. Read per storage
  # from GET /storage/{id}. Only set false if you have verified saferemove is off
  # everywhere in the group.
  account_saferemove_wipe: true
  # In-flight I/O charged to the SOURCE for the whole duration of that wipe -- both
  # in the migration cost model and in the saturation guard, where a draining move
  # charges this to its source and nothing to its target. The zeroing
  # pass is one sequential writer, so 1.0 is the natural value; lower it only if you
  # have measured that a throttled wipe does not disturb your array.
  wipe_load_weight: 1.0
  # Fraction of a storage's saturation_load (NOT of capability_weight) that a move
  # may drive it to. Inactive for any storage whose saturation_load is null.
  saturation_ceiling: 0.85
  # Kept only so a config that spells it out still loads; `false` is refused. This tool
  # never considers over-provisioning -- disks count at their provisioned size, on
  # thin-provisioned storage (Ceph RBD, LVM-thin, ZFS) as much as on thick.
  assume_thick_provisioning: true
  # Below this size, a disk carries neither the per-move nor the per-TiB penalty of
  # the objective below, and needs no payback verdict -- comfortably above an EFI var
  # store or TPM state, far below anything the payback rule was written for.
  # Together with kappa_vm_affinity below, this is what lets a tiny disk rejoin its
  # VM for free instead of being priced like a real migration. 0 restores the old
  # accounting for every disk.
  tiny_disk_bytes: 67108864            # 64 MiB

# ------------------------------------------------------------ objective weights
objective:
  spread_metric: l1            # "l1" (sum of deviations) or "minmax" (makespan)
  alpha_spread: 1.0            # weight on imbalance
  beta_move_count: 0.25        # penalty per migration  -> "minimal number of migrations"
  gamma_move_bytes_per_tib: 0.05  # penalty per TiB migrated
  kappa_vm_affinity: 0.50      # penalty per extra storage a VM's disks are spread over
  # Weight on data spread -- the deviation of each storage's bytes-used/capacity
  # from the group's mean. Bounds the share of a group's data any single storage
  # failure costs. Defaults to half of alpha_spread so I/O balance stays the first
  # priority; 0 disables the term.
  delta_capacity_spread: 0.5
  # Disks that cannot move THIS RUN (snapshot-blocked, config-excluded, or on a
  # locked VM) still count toward the affinity term by default: such a disk still
  # occupies a storage, so the VM really is spread, and its fixed location anchors
  # the VM's movable disks. false counts movable disks only, which makes reuniting
  # a VM with its pinned disks either unrewarded or outright penalized. Note
  # efidisk0/tpmstate0 are NOT in this set -- they move online on PVE 9.2.
  # Default changed from false after 0.1.6.
  affinity_counts_pinned_disks: true
  # Soft slack so an already-violating start stays repairable rather than infeasible.
  # This is a FLOOR, not the value used: with the single-stage big-M formulation the
  # engine computes the provably-dominant P from the group's own load and sizes and
  # uses max(this, computed), warning when it raises it. The default lexicographic
  # two-stage solve -- repair the reserve first, then balance within whatever room
  # that leaves -- needs no penalty at all and is preferred.
  reserve_violation_penalty: 1000.0

solver:
  backend: auto          # auto | cpsat | cbc | heuristic
  time_limit_seconds: 60
  mip_gap: 0.02
  heuristic_iterations: 5000

# ----------------------------------------------------------------- execution
execution:
  mode: dry-run          # dry-run | confirm | auto
  # >1 requires the GENERALIZED transient reserve invariant:
  # several disks can be landing on one storage at once and no source releases
  # space until it completes. Leave at 1 unless you have verified headroom.
  max_concurrent_migrations: 1
  max_migrations_per_run: 5
  max_concurrent_per_storage: 1   # counts a storage as both source and target
  max_replans_per_run: 3          # bound on mid-execution re-plans
  abort_on_failure: true
  poll_interval_seconds: 10

  # A VM config lock (backup, snapshot, migrate, clone, rollback, ...) blocks
  # move_disk. Locks are normal, not errors -- wait them out. The value set is
  # treated as open-ended: ANY non-empty lock means wait, never a whitelist.
  locks:
    wait_timeout: 4h          # generous: a backup of a large VM easily runs hours
    poll_interval: 30s
    on_timeout: skip          # skip | abort -- skip this move, keep the rest of the plan

    # A move_disk TASK can fail immediately with PVE's own "can't lock file
    # '/var/lock/qemu-server/lock-<vmid>.conf' - got timeout" -- a different
    # lock than wait_timeout above waits out, momentarily still held by the
    # previous move's own cleanup for the same VM even after the config
    # `lock:` attribute has already cleared. Retried automatically.
    task_retry_limit: 2       # extra attempts after the first task failure
    task_retry_backoff: 15s   # wait this long before reissuing move_disk

  # A move_disk task reporting OK does NOT mean the source space is back. With
  # saferemove the old volume is still fully allocated while it is being zeroed,
  # and the storage lock it holds can block the NEXT move. A move counts as done
  # only when the task succeeded AND the source volume is gone AND the VM is
  # unlocked.
  source_release:
    wait: true
    timeout: 48h              # >= largest disk / saferemove_throughput

  time_windows:          # empty = any time. Applies to "auto" mode only.
    - days: [mon, tue, wed, thu, fri, sat, sun]
      start: "22:00"
      end:   "06:00"

# ---------------------------------------------------------------- exclusions
exclude:
  vmids: []              # never move disks of these VMs
  disks: []              # e.g. ["101:scsi1"]
  storages: []           # never move onto/off these
  tags: ["no-drs"]       # PVE VM tags that opt a VM out
  # move_disk delete=1 is REJECTED by PVE on a volume with snapshots, and would not
  # carry the snapshots across if it were not. Setting this false does not make such
  # moves work -- it only stops pre-filtering them so they fail at the API instead.
  # Snapshotted disks are pinned (bytes and load still counted) and reported at WARN
  # every run, naming the VMs whose snapshots must be cleared.
  skip_vms_with_snapshots: true
  running_only: true              # only consider running VMs
  # unused{N} volumes are real allocated bytes with no I/O. Including them lets the
  # solver relocate one to repair a reserve violation; it will never move one for
  # balance, since the benefit is zero by construction. false pins them instead.
  include_unused_disks: true

report:
  # If pinned load (snapshots, efidisk/tpmstate, exclusions, locks) exceeds this
  # fraction of a group's total, the residual imbalance may be structural rather
  # than a planning failure. Report the best ACHIEVABLE spread next to the actual
  # one so the operator can see it is the snapshots, not the solver.
  warn_pinned_load_fraction: 0.25

state:
  # Local disk, never /etc/pve: this is rewritten on every run, pmxcfs writes
  # need quorum, and the file is deliberately node-local.
  path: /var/lib/pve-storage-drs/state.json

forecast:
  model: quantile        # quantile | seasonal_naive | holt_winters
  # Each forecaster declares the HISTORY it needs, independent of
  # window.lookback. Startup validation fails if Prometheus retention or the
  # configured window cannot supply it, rather than silently degrading:
  #   quantile        -> window.lookback                      (24h)
  #   seasonal_naive  -> seasonal_lookback_days                (7d)
  #   holt_winters    -> 2 * seasonal_periods * step           (48h)
  # NOTE: with seasonal_periods=288 at a 5m step, holt_winters needs 48h. A 24h
  # lookback alone can never satisfy it -- it would fall back to quantile forever.
  #
  # To switch model to holt_winters with the daily-cycle default below, also
  # raise window.lookback (above) to at least 48h -- it stays the DECISION
  # window (what load is balanced over), so most deployments just set it to
  # match: 48h. Both plan/apply's saturation guard and collect-testdata
  # fetch this history in day-sized chunks regardless of how wide it gets
  # (see the RANGE_QUERY_CHUNK_SECONDS note in docs/internals/30-metrics.md),
  # so this is a Prometheus-request-count cost, never a backend point-per-
  # series-resolution-limit risk, even for the weekly example below.
  #
  # For WEEKLY seasonality instead (weekends look different from weekdays):
  #   window:
  #     lookback: 28d               # >= 2 * seasonal_periods * step
  #   forecast:
  #     model: holt_winters
  #     holt_winters:
  #       seasonal_periods: 2016     # 7d at 5m step
  seasonal_lookback_days: 7    # used by seasonal_naive; 0 disables
  holt_winters:
    seasonal_periods: 288      # 24h at 5m step
    trend: add
    seasonal: add
    residual_z: 2.0            # upper bound = point + z * sigma(residuals)

support:
  # Diagnostic bundles: `pve-storage-drs collect-testdata` and the global
  # `--replay` option. Nothing here is read on the normal plan/apply path.
  #
  # 32 random bytes, generated on first use and persisted here. Keyed
  # pseudonyms (node/storage/vmid/...) are stable for the life of this file;
  # `--new-salt` rotates it, after which old and new bundles no longer share
  # a mapping. Per node by default -- point this at a pmxcfs path (e.g.
  # /etc/pve/pve-storage-drs-anon-salt) if every node in the cluster should
  # produce the same pseudonyms.
  salt_path: /var/lib/pve-storage-drs/anonymization-salt
  # Default -o/--output for collect-testdata.
  bundle_dir: /var/lib/pve-storage-drs/testdata
  # Hard refusal, not a truncation: collect-testdata prints the estimated
  # series-sample count before fetching anything and refuses above this,
  # naming the --range/--step/--no-series flags that would bring it under.
  max_series_points: 5000000
  # "auto" captures the union of every forecaster's required_range() (section
  # 16.2), currently max(window.lookback, forecast.seasonal_lookback_days,
  # 2 * holt_winters.seasonal_periods * metrics.step) -- the superset any
  # supported config could need, not just the one active here. A duration
  # (e.g. "14d") overrides it; --range on the command line overrides both.
  capture_range: auto

monitoring:
  # Where `apply` leaves a one-run status report for monitoring. null (the
  # default) writes nothing. The format is that of the `check_statusfile`
  # plugin from monitoring-plugins-contrib -- line 1 is OK, WARNING or
  # CRITICAL, then the output -- so a check like
  #     /usr/lib/nagios/plugins/check_statusfile /var/lib/pve-storage-drs/status
  # is all a monitoring system needs. The file is rewritten by EVERY apply run,
  # including dry runs and runs that moved nothing, because its modification
  # time is what tells the plugin the timer is still firing (default: WARNING
  # after 26 h; `check_statusfile -a 2h` for a shorter timer). CRITICAL: the run
  # failed (a failed move, or PVE/Prometheus could not be read). WARNING: it
  # gave up after too many outside changes, left an orphaned volume, or a group
  # is still short of its reserve or free-space requirement. Nothing is
  # written when the configuration cannot be read (the file then goes stale).
  # Mode 0644, written atomically; the directory is created if missing.
  status_file: null
