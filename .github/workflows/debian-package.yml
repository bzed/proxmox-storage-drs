#
# Builds the package in debian:trixie -- the base of Proxmox VE 9.x -- and then
# installs it and runs the autopkgtests against the installed package. The
# build chroot has the Build-Depends available and so cannot detect a missing
# runtime dependency; only the install-and-run step can.
#
# `ca-certificates` is explicit below (see tests.yml's own header for why):
# --no-install-recommends drops it since it is only a Recommends, not a
# Depends, of the packages here -- without it `actions/checkout`'s `git
# fetch` over https has no trusted root store and fails outright.
name: Debian package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build in debian:trixie
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates devscripts equivs git lintian

      - uses: actions/checkout@v7

      # debian/control is the single source of truth for build dependencies:
      # mk-build-deps reads it, so a dependency that is missing there fails
      # here rather than on somebody's machine.
      - name: Install the build dependencies from debian/control
        run: |
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' debian/control

      - name: The packaging itself is well formed
        run: |
          dpkg-parsechangelog >/dev/null
          changelog=$(dpkg-parsechangelog -S Version | sed 's/[-+~].*//')
          pyproject=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "$changelog" != "$pyproject" ]; then
            echo "debian/changelog says $changelog, pyproject.toml says $pyproject"
            exit 1
          fi
          echo "version $changelog agrees in both places"

      - name: Build the package
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian --info --display-info --pedantic ../pve-storage-drs_*.changes

      # The real test of the dependency declarations: install the package on a
      # system that never had the build dependencies, and run it.
      - name: Install the package and run the autopkgtests
        run: |
          apt-get purge -y pve-storage-drs-build-deps
          apt-get autoremove -y
          apt-get install -y ../pve-storage-drs_*.deb
          pve-storage-drs --version
          pve-storage-drs --help
          debian/tests/import-all

      - name: Collect the artefacts
        run: |
          mkdir -p artefacts
          cp ../pve-storage-drs_*.deb ../pve-storage-drs_*.changes artefacts/

      - uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: artefacts/
