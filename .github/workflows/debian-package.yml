#
# Builds the package in debian:trixie -- the base of Proxmox VE 9.x -- and then
# installs it and runs the autopkgtests against the installed package. The
# build chroot has the Build-Depends available and so cannot detect a missing
# runtime dependency; only the install-and-run step can.
#
# `ca-certificates` is explicit below (see tests.yml's own header for why):
# --no-install-recommends drops it since it is only a Recommends, not a
# Depends, of the packages here -- without it `actions/checkout`'s `git
# fetch` over https has no trusted root store and fails outright.
#
# Pushing a `debian/<version>` tag (git-buildpackage's default tag format, what
# `gbp tag` creates) additionally publishes the built .deb as a GitHub release
# download. The release job only runs after every build step above it -- the
# install-and-run test included -- has passed, and refuses a tag whose version
# is not the one debian/changelog carries.
name: Debian package

on:
  push:
    branches: [main]
    tags: ['debian/*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build in debian:trixie
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates devscripts equivs git lintian

      - uses: actions/checkout@v7

      # debian/control is the single source of truth for build dependencies:
      # mk-build-deps reads it, so a dependency that is missing there fails
      # here rather than on somebody's machine.
      - name: Install the build dependencies from debian/control
        run: |
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' debian/control

      - name: The packaging itself is well formed
        run: |
          dpkg-parsechangelog >/dev/null
          changelog=$(dpkg-parsechangelog -S Version | sed 's/[-+~].*//')
          pyproject=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "$changelog" != "$pyproject" ]; then
            echo "debian/changelog says $changelog, pyproject.toml says $pyproject"
            exit 1
          fi
          echo "version $changelog agrees in both places"

      # Before the build, so a mistyped tag fails in seconds and not after the
      # lintian and install steps.
      - name: The release tag matches debian/changelog
        if: startsWith(github.ref, 'refs/tags/debian/')
        run: |
          changelog=$(dpkg-parsechangelog -S Version)
          tag=${GITHUB_REF_NAME#debian/}
          if [ "$tag" != "$changelog" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, debian/changelog says $changelog"
            exit 1
          fi

      - name: Build the package
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian --info --display-info --pedantic ../pve-storage-drs_*.changes

      # The real test of the dependency declarations: install the package on a
      # system that never had the build dependencies, and run it.
      - name: Install the package and run the autopkgtests
        run: |
          apt-get purge -y pve-storage-drs-build-deps
          apt-get autoremove -y
          apt-get install -y ../pve-storage-drs_*.deb
          pve-storage-drs --version
          pve-storage-drs --help
          debian/tests/import-all

      - name: Collect the artefacts
        run: |
          mkdir -p artefacts
          cp ../pve-storage-drs_*.deb ../pve-storage-drs_*.changes artefacts/
          # The newest changelog entry, as the release description.
          dpkg-parsechangelog -S Changes | tail -n +4 | sed -e 's/^  //' -e 's/^\.$//' \
            > artefacts/release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: artefacts/

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/debian/')
    runs-on: ubuntu-latest
    # The only job that can write to the repository, and it runs no
    # repository code: it uploads what `build` produced.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: artefacts/

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd artefacts
          sha256sum *.deb > SHA256SUMS
          version=${GITHUB_REF_NAME#debian/}
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run of the workflow for the same tag: replace the assets.
            gh release upload "$GITHUB_REF_NAME" --clobber *.deb SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "pve-storage-drs $version" \
              --notes-file release-notes.md \
              *.deb SHA256SUMS
          fi
