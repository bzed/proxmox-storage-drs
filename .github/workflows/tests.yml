#
# Everything runs in debian:trixie, the base of Proxmox VE 9.x, with the
# toolchain installed from apt rather than pip. That is not incidental: the
# dependency policy is that Debian's packaged modules are enough, and a CI that
# pip-installed its way around a missing package would hide the day that
# stopped being true.
#
# `ca-certificates` is explicit in every apt-get call below, not left to
# whatever another package happens to pull in transitively: it is only a
# Recommends of most packages that need it (git included), so
# --no-install-recommends silently drops it, and `actions/checkout`'s own
# `git fetch` over https then fails with "Problem with the SSL CA cert" --
# this container has no trusted root store at all until it is installed.
#
# Same story for `python3-typeshed` in the "test" job: `mypy` (the bare apt
# package) only Recommends it, but it is what actually provides the
# third-party stub packages (PyYAML, requests, ...) mypy's own error message
# points at ("On Debian systems, you can install the python3-typeshed
# package..."); without it, every untyped-library import fails strict mode.
#
# `curl` and `gpg` are there for the Codecov actions: they shell out to fetch
# and verify the `codecov` uploader binary themselves, and neither is pulled
# in by anything else installed in this container.
#
# `ortools` (CP-SAT, `optimize.py`'s preferred MILP backend) is the one
# exception to "Debian's packaged modules are enough": it has no Debian
# package at all (`docs/internals/91-optimize.md`), so it is `pip install`ed
# here purely to give `test_optimize.py`'s cpsat-parametrized cases something
# to run against -- without it, roughly half of optimize.py (every
# `_cpsat_*`/`_solve_cpsat` function) is structurally unreachable and shows
# up as a coverage gap that no amount of new tests against the packaged
# toolchain alone could close. This does not weaken "packaged is enough" for
# anything the tool actually depends on: `ortools` stays optional at runtime
# (`solver.backend: auto` falls back to `cbc`, then the heuristic, if it is
# missing) and the package build/install never needs it. Installed *after*
# "Format, lint and types" runs, not before: a recent `ortools`-pulled numpy
# ships type stubs `mypy`'s `python_version = "3.11"` target cannot parse
# (same doc, "A live cluster's numpy/pandas footprint"), and this ordering
# is what keeps that from ever reaching the typecheck step.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the toolchain from Debian
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            black ca-certificates coinor-cbc curl flake8 git gpg isort make \
            mypy pandoc python3-jsonschema python3-pip python3-proxmoxer \
            python3-pulp python3-pytest python3-pytest-cov python3-pytest-xdist \
            python3-requests python3-ruamel.yaml python3-typeshed python3-yaml

      - uses: actions/checkout@v7

      - name: Fixtures are current
        run: make SYSTEM_TOOLS=1 fixtures

      - name: Manpage builds and is clean
        run: make SYSTEM_TOOLS=1 man-check

      - name: Format, lint and types
        run: make SYSTEM_TOOLS=1 fmt-check lint typecheck

      - name: Install ortools for CP-SAT test coverage
        run: pip install --break-system-packages 'ortools>=9.8'

      - name: Tests with coverage
        run: |
          python3 -m pytest \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --junitxml=junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

      # codecov/test-results-action is deprecated in favour of running
      # codecov-action itself a second time with report_type: test_results
      # (the same action already runs once above, for coverage).
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      # trixie ships pandoc 3.1, which is older than the one this is usually
      # developed against; building here is what keeps the document pipeline
      # honest about the version Proxmox VE 9.x actually has.
      - name: Install the document toolchain from Debian
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates fonts-dejavu-core fonts-dejavu-mono fonts-sil-gentiumplus \
            fonts-symbola git groff latexmk make pandoc python3 \
            texlive-latex-extra texlive-luatex

      - uses: actions/checkout@v7

      - name: The committed PDF matches the Markdown
        run: sha256sum --check docs/IMPLEMENTATION_PLAN.pdf.sha256

      # Not compared byte-for-byte against the committed PDF: the build is
      # reproducible for a fixed toolchain, and trixie's pandoc is a different
      # one. What this proves is that the documents still build on the target
      # distribution -- and `make pdf` fails on a missing glyph or an overfull
      # box, so "it built" is a real statement about the result.
      - name: Rebuild every document from source
        run: make SYSTEM_TOOLS=1 docs

      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: |
            docs/IMPLEMENTATION_PLAN.pdf
            man/pve-storage-drs.1
