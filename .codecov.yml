#
# The 85 % floor is enforced by pytest itself (--cov-fail-under in
# pyproject.toml); Codecov reports the trend and annotates the diff.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 85%

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "tests/**"
  - "tools/**"
  - "docs/**"
